AWSTemplateFormatVersion: "2010-09-09"
Description: Parent Stack

Resources:

  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://YOUR-BUCKET.s3.amazonaws.com/VPCStack.yaml

  ComputeStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VPCStack

    Properties:
      TemplateURL: https://YOUR-BUCKET.s3.amazonaws.com/EC2Stack.yaml

      Parameters:
        VPCId: !GetAtt VPCStack.Outputs.VPCId
        SubnetId: !GetAtt VPCStack.Outputs.PublicSubnet1

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VPCStack

    Properties:
      TemplateURL: https://YOUR-BUCKET.s3.amazonaws.com/RDSStack.yaml

      Parameters:
        VPCId: !GetAtt VPCStack.Outputs.VPCId
        Subnet1: !GetAtt VPCStack.Outputs.PublicSubnet1
        Subnet2: !GetAtt VPCStack.Outputs.PublicSubnet2
