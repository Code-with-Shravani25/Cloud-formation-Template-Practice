AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 Stack

Parameters:

  VPCId:
    Type: AWS::EC2::VPC::Id

  SubnetId:
    Type: AWS::EC2::Subnet::Id

Resources:

  EC2SG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 Security Group
      VpcId: !Ref VPCId

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  MyEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-091138d0f0d41ff90
      InstanceType: t2.micro
      SubnetId: !Ref SubnetId

      SecurityGroupIds:
        - !Ref EC2SG

Outputs:

  EC2Id:
    Value: !Ref MyEC2
