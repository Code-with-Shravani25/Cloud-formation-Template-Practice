AWSTemplateFormatVersion: "2010-09-09"
Description: VPC Stack

Resources:

  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.1.0/24

Outputs:

  VPCId:
    Value: !Ref MyVPC

  PublicSubnetId:
    Value: !Ref PublicSubnet
