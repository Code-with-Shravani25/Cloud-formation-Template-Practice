# Launch EC2 with SG
AWSTemplateFormatVersion: '2010-09-09'
Description: Create EC2 and SG and use it in EC2
Resources:
  MySG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
  MyEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.medium
      ImageId: ami-091138d0f0d41ff90
      KeyName: Demo
      SecurityGroupIds:
        - !Ref MySG
