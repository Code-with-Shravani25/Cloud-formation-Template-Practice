AWSTemplateFormatVersion: "2010-09-09"
Description: Import VPC ID and create Security Group

Resources:
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Demo SG

      VpcId:
        Fn::ImportValue: MyVPC-ID

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  # Create the Export stack first then it can use the vpc id here when we create this stack.
