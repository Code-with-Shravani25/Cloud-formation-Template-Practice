# Create S3 bucket with Versioning
AWSTemplateFormatVersion: "2010-09-09"
Description: S3 Bucket with Versioning
Resources:
    MyS3:
      Type: AWS::S3::Bucket
      Properties:
          VersioningConfiguration:
            Status: Enabled
Outputs:
  S3Name:
    Description: Bucket name
    Value: !Ref MyS3            
